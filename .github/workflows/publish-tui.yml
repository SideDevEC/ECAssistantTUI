name: Publish ECAssistant.TUI NuGet Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 12.9.0)'
        required: true
        default: '12.9.0'
  push:
    tags:
      - 'tui-v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source \
            --username SideDevEC \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            https://nuget.pkg.github.com/SideDevEC/index.json

      - name: Restore dependencies
        run: dotnet restore ECAssistant.TUI.csproj

      - name: Build (Release)
        run: dotnet build ECAssistant.TUI.csproj --configuration Release --no-restore

      - name: Set version from tag or input
        id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/tui-v}"
            echo "version=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Pack NuGet package
        run: |
          dotnet pack ECAssistant.TUI.csproj \
            --configuration Release \
            --no-build \
            /p:PackageVersion=${{ steps.version.outputs.version }} \
            -o ./nupkg

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source https://nuget.pkg.github.com/SideDevEC/index.json \
            --skip-duplicate

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecassistant-tui-${{ steps.version.outputs.version }}
          path: ./nupkg/*.nupkg
          retention-days: 30
